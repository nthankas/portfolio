name: Deploy

# Builds the site and publishes it to GitHub Pages.
#
# Switching deploy target is a change to src/site.config.ts, not to this file.
# Set `deploy.site` and `deploy.base` there; set `deploy.customDomain` to a bare
# hostname and this workflow emits the CNAME file Pages needs.
#
# Before the first run: repository Settings > Pages > Source > GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight run finish rather than
# cancelling it, so a partial upload is never published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs check:gaps first, which fails the build if a placeholder string
      # would reach a visitor or a copy rule is broken.
      - run: npm run build

      - name: Emit CNAME when a custom domain is configured
        run: |
          DOMAIN=$(node -e "import('./src/site.config.ts').then(m => process.stdout.write(m.deploy.customDomain ?? ''))" 2>/dev/null || true)
          if [ -n "$DOMAIN" ]; then
            echo "$DOMAIN" > dist/CNAME
            echo "Wrote dist/CNAME for $DOMAIN"
          else
            echo "No custom domain configured; skipping CNAME."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
