name: Deploy

# Builds the site and publishes dist/ to the gh-pages branch, which GitHub
# Pages serves at nthankas.github.io/portfolio.
#
# Why branch-based rather than the official Pages Actions flow: creating the
# Pages site through the API requires repository-settings access that app
# tokens are refused, while pushing a gh-pages branch enables and updates
# Pages with nothing but contents access. Same result, fewer permissions.
#
# Switching deploy target is a change to src/site.config.ts, not to this file.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs check:gaps first, which fails the build if a placeholder string
      # would reach a visitor or a copy rule is broken.
      - run: npm run build

      - name: Emit CNAME when a custom domain is configured
        run: |
          DOMAIN=$(node -e "import('./src/site.config.ts').then(m => process.stdout.write(m.deploy.customDomain ?? ''))" 2>/dev/null || true)
          if [ -n "$DOMAIN" ]; then
            echo "$DOMAIN" > dist/CNAME
            echo "Wrote dist/CNAME for $DOMAIN"
          else
            echo "No custom domain configured; skipping CNAME."
          fi

      - name: Publish dist to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
